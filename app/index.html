<script>
/* Network lock (Settings → "Network lock"): runs before anything else loads. When on, a Content Security
   Policy blocks every network connection this page could make (fetch/XHR, images, frames, forms, workers);
   the browser enforces it. Local files (scripts, styles, icons) still load. */
(function(){ try {
  if (JSON.parse(localStorage.getItem('todo.netLock') || 'false')){
    document.write('<meta http-equiv="Content-Security-Policy" content="' +
      "connect-src 'none'; img-src 'self' data: blob: file:; media-src 'none'; frame-src 'none'; child-src 'none'; " +
      "worker-src 'none'; object-src 'none'; form-action 'none'; manifest-src 'self' file:; font-src 'self' data: file:" + '">');
    window.__NETLOCK__ = true;
  }
} catch (e) {} })();
/* R2-6: sign-in bridge. A popup or background sign-in comes back to this page in its own small window or hidden
   frame, carrying Microsoft's answer in the address. MSAL 5 needs that window to hand the answer to the app window
   (msal-redirect-bridge) and close — it must not start a second copy of the app. A normal redirect sign-in is left
   to the app (MsalAuth.init). Everything after this script is swallowed (<plaintext>), so nothing else loads. */
(function(){ try {
  var h = location.hash.replace(/^#/, ''), q = location.search.replace(/^\?/, '');
  var p = new URLSearchParams(/(^|&)state=/.test(h) ? h : q), st = p.get('state');
  if (!st || !(p.has('code') || p.has('error'))) return;
  var b = st.split('|')[0].replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
  var kind = (JSON.parse(atob(b)).meta || {}).interactionType;
  if (kind !== 'popup' && kind !== 'silent') return;
  window.__AUTH_BRIDGE__ = kind;
  document.write('<title>Signing in…</title><script src="vendor/msal-redirect-bridge.min.js"><\/script>' +
    '<script>msalRedirectBridge.broadcastResponseToMainFrame().catch(function(e){ document.body.textContent = "Sign-in window: " + (e && (e.errorCode || e.message)); });<\/script>' +
    '<body style="background:#161b22;color:#c9d1d9;font:16px system-ui;padding:24px">Signing in… this window closes by itself.</body><plaintext style="display:none">');
} catch (e) {} })();
</script>
<title>HTML-ToDo-App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#161b22">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/toastui-editor.css">
<link rel="stylesheet" href="vendor/toastui-editor-dark.css">
<style>
:root{
  color-scheme: dark;
  --z:1;            /* text size (R1-4): 1 = 100%; set from Settings, phones default 1.25 */
  /* surfaces */
  --bg:#0f1318; --panel:#161b22; --col:#1b2129; --card:#222a34; --card-hover:#283140; --line:#262e39;
  --text:#e6edf3; --muted:#8b97a6;
  /* blue = highlight / interactive */
  --accent:#5b9bff; --accent-strong:#2f6fe4; --accent-ink:#ffffff; --accent-soft:rgba(91,155,255,.14);
  /* supporting accents */
  --danger:#ff6b6b;   /* overdue, delete */
  --warn:#f5b545;     /* due today, unsaved, conflicts, unrecognized frontmatter */
  --ok:#3ecf8e;       /* done, active dot, signed in */
  --badge:#e39cff;    /* subtask count: stands out from titles */
  --chip:#2a2550; --chip-ink:#c4b5fd;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:calc(15px*var(--z))/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent-strong);color:var(--accent-ink);border-color:var(--accent-strong)}
button.primary:hover:not(:disabled){background:#3d7cf0}
button.primary:disabled{opacity:.45;cursor:default}
button.ghost{border-color:transparent;background:transparent}
button.btn-green{background:#1f9d63;color:#fff;border-color:#1f9d63} button.btn-green:hover{background:#27b373;border-color:#27b373}   /* green: Save & close (unique name — .ok is a status-icon state) */
button.danger{color:var(--danger)}
button.primary.danger{background:#c9302c;border-color:#c9302c;color:#fff} button.primary.danger:hover:not(:disabled){background:#d9443f;border-color:#d9443f}   /* R2-15: white on a deep red (was red text on blue) */
button.btn-green.sc-idle{opacity:.45} button.btn-green.sc-idle:hover{background:#1f9d63;border-color:#1f9d63}   /* R2-12: nothing to save yet; a tap still closes */
input[type=text],input[type=date],input[type=search],select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent)}

/* header: the list name is the main control */
header{display:flex;gap:6px;align-items:center;padding:6px 8px 6px 4px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.list-name{border:0;background:none;font-size:calc(22px*var(--z));font-weight:700;padding:6px 8px;min-height:calc(44px*var(--z));flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.list-name .caret{font-size:calc(14px*var(--z));color:var(--muted);margin-left:4px}
.spacer{flex:1}
.ver{font-size:calc(11px*var(--z));color:var(--muted);white-space:nowrap}
@media (max-width:600px){                        /* phones: the list name gets the room */
  .ver{display:none}                             /* the build is shown in Settings */
  header{padding-right:0;gap:0}
  header .stat{min-width:calc(16px*var(--z));padding:0 2px}                    /* status dot sits right next to ⋯ */
  #app-menu{min-width:calc(30px*var(--z));text-align:right;padding:0 8px 0 0} /* ⋯ flush with the right edge; tap area stays full height */
}
/* same phone header when Chrome's "Desktop site" mode reports a wide screen (html.phone is set by script, R1-15) */
html.phone .ver{display:none}
html.phone header{padding-right:0;gap:0}
html.phone header .stat{min-width:calc(16px*var(--z));padding:0 2px}
html.phone #app-menu{min-width:calc(30px*var(--z));text-align:right;padding:0 8px 0 0}
.icon{border:0;background:none;min-width:calc(44px*var(--z));min-height:calc(44px*var(--z));font-size:calc(20px*var(--z));padding:0}
.stat{border:0;background:none;min-width:calc(28px*var(--z));min-height:calc(44px*var(--z));font-size:calc(16px*var(--z));padding:0}
.stat.ok,.stat.local{color:var(--ok)} .stat.sync{color:var(--accent)} .stat.offline,.stat.signedout{color:var(--danger)}
.stat.conflict{color:var(--warn)} .stat.demo,.stat.off{color:var(--muted)}

/* list: whole list scrolls sideways together; prefix + actions stay pinned */
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#scroller{flex:1;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* pull to refresh (in-app): re-reads the file list from OneDrive */
#ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--muted);font-size:calc(13px*var(--z));flex:0 0 auto;transition:height .15s ease}
#ptr.pulling{transition:none} #ptr.ready{color:var(--accent)} #ptr span{padding-bottom:8px}
#rows{width:max-content;min-width:100%;padding-bottom:12px}
.row{display:flex;align-items:stretch;min-height:calc(44px*var(--z));border-bottom:1px solid var(--line)}
.row>.pfx{position:sticky;left:0;z-index:2;flex:0 0 calc(44px*var(--z));display:flex;align-items:center;justify-content:center;background:var(--bg)}
.row>.ttl{flex:1 0 auto;display:flex;align-items:center;white-space:nowrap;padding:0 10px 0 4px;cursor:pointer;font-size:calc(16px*var(--z));user-select:none}
.row>.act{position:sticky;right:0;z-index:2;flex:0 0 auto;display:flex;align-items:center;background:var(--bg);padding-left:2px}
.row>.ind{position:sticky;left:0;z-index:2;flex:0 0 auto;background:var(--bg)}   /* subtask indent: keeps the checkbox next to its title */
.row.done>.ttl{color:var(--muted);text-decoration:line-through}
/* long-press move (R1-12 #13) */
.row{-webkit-touch-callout:none;user-select:none}
@keyframes lift{0%{background:var(--accent-soft)}50%{background:rgba(91,155,255,.35)}100%{background:var(--accent-soft)}}
.row.lifting{animation:lift .35s ease 2;background:var(--accent-soft)}
.row.dragging-src{opacity:.35}
.row.drop-child>.ttl,.row.drop-child>.pfx,.row.drop-child>.act{background:rgba(91,155,255,.22)}
.row.drop-before{box-shadow:inset 0 3px 0 var(--accent)} .row.drop-after{box-shadow:inset 0 -3px 0 var(--accent)}
#drag-ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.55);border:1px solid var(--accent);border-radius:8px;background:var(--card);overflow:hidden}
#drag-ghost .row{border-bottom:0}
#drag-hint{position:fixed;left:50%;bottom:calc(80px*var(--z));max-width:92vw;transform:translateX(-50%);z-index:61;background:var(--accent-strong);color:#fff;padding:4px 12px;border-radius:12px;font-size:calc(13px*var(--z));pointer-events:none;display:none}
#drag-hint.on{display:block}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}} .badge.pulse{animation:pulse .4s ease 2}
.row.new-unsaved>.ttl{color:var(--accent)}
.ck{width:calc(44px*var(--z));height:calc(44px*var(--z));border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
.ck .box{width:calc(20px*var(--z));height:calc(20px*var(--z));border:2px solid var(--muted);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:calc(14px*var(--z));line-height:1}
.ck.done .box{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.ck .dot{position:absolute;right:8px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.ck.unknown .box{border-color:var(--warn)}
.ck:disabled{cursor:not-allowed}
.bullet{font-size:calc(22px*var(--z));color:var(--muted)}
.rep-ico{color:var(--accent);font-size:calc(14px*var(--z));margin-left:6px}
.wflag{color:var(--warn);font-size:calc(13px*var(--z));margin-left:6px}
.badge{border:1px solid var(--badge);color:var(--badge);background:transparent;border-radius:12px;font-size:calc(12px*var(--z));min-width:calc(44px*var(--z));height:calc(30px*var(--z));padding:0 6px;margin:0 2px;font-variant-numeric:tabular-nums;position:relative}
.badge.open{background:rgba(227,156,255,.12)}
.row-more{border:0;background:none;width:calc(40px*var(--z));min-height:calc(44px*var(--z));font-size:calc(20px*var(--z));color:var(--muted);padding:0}
.empty-hint{color:var(--muted);padding:30px 18px;text-align:center;width:100vw;max-width:100vw;white-space:normal;position:sticky;left:0}
.qbtn{border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:8px;font-size:calc(12px*var(--z));height:calc(32px*var(--z));padding:0 calc(7px*var(--z));margin:0 2px;white-space:nowrap;position:relative}
/* T1-10 (R1-12 #8): compact buttons keep their look but get a 44 px tall tap area */
.stray-chip{color:var(--warn);font-size:calc(12px*var(--z));margin-left:8px;white-space:nowrap}
.stray-btn{border:1px solid var(--warn);color:var(--warn);background:transparent;border-radius:12px;font-size:calc(12px*var(--z));height:calc(30px*var(--z));padding:0 6px;margin:0 2px;white-space:nowrap}
.qbtn.qarrow{min-width:calc(24px*var(--z));width:calc(24px*var(--z));padding:0;margin:0;border:0;background:none;font-size:calc(17px*var(--z));line-height:1}   /* R2-14: ↑ ↓ ●, plain icons; the tall tap area comes from .qbtn::after */
.qbtn.qdot{font-size:calc(12px*var(--z))} .qgap{flex:0 0 calc(24px*var(--z))}   /* keeps ↑ ↓ lined up on today's rows */
/* R2-11: the inline "+ Add subtask…" line under an expanded parent (not a .row: no long-press move) */
.addsub{display:flex;align-items:center;min-height:calc(40px*var(--z));border-bottom:1px solid var(--line);position:sticky;left:0;width:100vw;max-width:100vw}
.addsub>.ind{flex:0 0 auto}
.addsub-plus{flex:0 0 calc(44px*var(--z));text-align:center;color:var(--muted);font-size:calc(18px*var(--z))}
.addsub-in{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:calc(15px*var(--z));padding:6px 4px;outline:none}
.addsub-in::placeholder{color:var(--muted)}
.addsub-ed{flex:0 0 auto;border:0;background:none;color:var(--muted);width:calc(40px*var(--z));min-height:calc(40px*var(--z));font-size:calc(16px*var(--z));padding:0}
.due-wrap{display:flex;gap:4px;align-items:stretch} .due-wrap>input{flex:1;min-width:0}
#f-due-clear{flex:0 0 auto;padding:0 10px}
.qbtn::after,.badge::after{content:"";position:absolute;left:0;right:0;top:calc(-6px*var(--z));bottom:calc(-6px*var(--z))}
.badge::after{top:calc(-7px*var(--z));bottom:calc(-7px*var(--z))}
.tday-head{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:0;min-height:calc(44px*var(--z))}
.tday-head.tday-fixed{cursor:default;color:var(--text)}
.tday-later{display:block;border:0;border-bottom:1px solid var(--line);background:none;color:var(--accent);position:sticky;left:0;width:100vw;text-align:left;padding:0 14px;min-height:calc(44px*var(--z));font-size:calc(14px*var(--z))}
.group-head{position:sticky;left:0;font-size:calc(12px*var(--z));color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:14px 12px 4px;width:100vw}
.group-head.tday-group{padding-top:calc(14px - 8px*var(--z));padding-bottom:0}   /* the 44 px header button takes up the old padding */
#snap{position:absolute;left:10px;bottom:10px;z-index:5;width:calc(44px*var(--z));height:calc(44px*var(--z));border-radius:22px;background:var(--accent-strong);color:#fff;border:0;font-size:calc(20px*var(--z));box-shadow:0 2px 10px rgba(0,0,0,.5)}
#snap[hidden]{display:none}

/* quick-add */
footer{flex:0 0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
#quick{display:flex;gap:6px;align-items:center}
#qa{flex:1 1 auto;min-width:0;width:100%;min-height:calc(44px*var(--z));font-size:calc(16px*var(--z))}
.qa-chip{flex:0 0 auto;min-height:calc(44px*var(--z));border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:10px;padding:0 min(calc(8px*var(--z)),10px);font-size:min(calc(13px*var(--z)),17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qa-list{max-width:22vw}
.qa-chip[hidden]{display:none}

/* start / sign-in screen */
.start{max-width:520px;margin:40px auto;padding:0 18px;text-align:center}
.start h2{margin:0 0 10px}
.start p{color:var(--muted)}
.start .btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.start .btns button{min-height:calc(44px*var(--z))}

/* drawer (full screen on phones) */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s ease;z-index:20}
#drawer.open{transform:none}
/* R2-6: on a phone the editor is exactly the screen's width (100vw is Chrome's 980 px in Desktop-site mode, which the
   page zoom then blew up past the screen), and it scrolls if the fields and notes don't fit */
html.phone #drawer{left:0;width:auto;border-left:0;overflow-y:auto}
/* ⤢ on the notes toolbar: the notes take the whole editor (fields, checklist and footer hidden; the changed-elsewhere
   banner stays); on a PC the editor also widens to the full window. ⤡ or opening another task puts it back. */
#drawer.notes-big .d-fields,#drawer.notes-big .d-note,#drawer.notes-big .d-checklist,#drawer.notes-big .d-foot{display:none}
html:not(.phone) #drawer.notes-big{width:100vw}
#drawer.notes-big #editor-wrap{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.d-head{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.d-head .dirty{color:var(--warn);font-size:calc(12px*var(--z));visibility:hidden}
@media (max-width:600px){ .d-head .d-title{display:none} .d-head .dirty{flex:1} }   /* phones: room for Save + Save & close */
html.phone .d-head .d-title{display:none} html.phone .d-head .dirty{flex:1}
/* phones: editor header buttons stay on one line — text capped so ✕ Raw Save "Save & close" always fit */
.d-head button{white-space:nowrap}
html.phone .d-head{gap:6px;padding:8px 8px}
html.phone #drawer .d-head button{font-size:calc(14px*min(var(--z),1.15));padding:5px 9px;min-height:calc(40px*min(var(--z),1.25))}
html.phone .d-head .dirty{min-width:0;overflow:hidden;white-space:nowrap;font-size:calc(11px*min(var(--z),1.15))}
.d-head .dirty.on{visibility:visible}
.d-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px}
.d-fields label{display:flex;flex-direction:column;font-size:calc(11px*var(--z));color:var(--muted);gap:3px}
.d-fields .wide{grid-column:span 4}
#f-title{font-size:calc(17px*var(--z));font-weight:600}
.d-note{font-size:calc(12px*var(--z));color:var(--muted);padding:0 12px 6px}
.d-note.warn{color:var(--warn)}
.d-note:empty{display:none}
.d-banner{margin:0 12px 8px;padding:6px 10px;border-radius:6px;border:1px solid var(--warn);color:var(--warn);font-size:calc(12px*var(--z));display:none}
.d-banner.on{display:block}
#editor-wrap{flex:1;min-height:200px;padding:0 12px}
.d-checklist{padding:8px 12px;border-top:1px solid var(--line);max-height:22vh;overflow:auto}
.d-checklist h4{margin:0 0 4px;font-size:calc(12px*var(--z));color:var(--muted)}
.ck-item{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:calc(13px*var(--z))}
.ck-item span{flex:1}
.ck-item.checked span{text-decoration:line-through;color:var(--muted)}
.ck-item button{font-size:calc(12px*var(--z));padding:2px 8px}
.d-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.d-foot .file{flex:1 1 100%;font-size:calc(12px*var(--z));color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:700px){
  .d-fields{grid-template-columns:1fr 1fr} .d-fields .wide{grid-column:span 2}
  .d-head button,.d-foot button{min-height:calc(40px*var(--z))}
}
html.phone .d-fields{grid-template-columns:1fr 1fr} html.phone .d-fields .wide{grid-column:span 2}
html.phone .d-head button,html.phone .d-foot button{min-height:calc(40px*var(--z))}

/* modal / sheet / popover / toast */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:40}
#modal-bg.on{display:flex}
#modal-bg.sheet{align-items:flex-end}
#modal:focus{outline:none}
#modal{background:var(--panel);border-radius:12px;width:min(560px,94vw);max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#modal-bg.sheet #modal{width:100%;max-width:640px;border-radius:14px 14px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
#modal h3{margin:0 0 10px}
#modal .opts label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
#modal .btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:14px}
#modal .btns button{min-height:calc(40px*var(--z))}
#modal pre{background:var(--col);padding:8px;border-radius:6px;font-size:calc(12px*var(--z));white-space:pre-wrap;max-height:180px;overflow:auto}
#modal select,#modal input[type=text]{width:100%}
#modal fieldset{border:1px solid var(--line);border-radius:6px;margin:10px 0;padding:6px 10px}
#modal legend{font-size:calc(12px*var(--z));color:var(--muted)}
.pick{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.pick button.go{flex:1;text-align:left;border:0;background:none;min-height:calc(48px*var(--z));font-size:calc(17px*var(--z));padding:0 6px}
.pick.on button.go{color:var(--accent);font-weight:600}
.pick .cnt{color:var(--muted);font-size:calc(13px*var(--z));min-width:28px;text-align:right}
.pick .ren{border:0;background:none;min-width:calc(44px*var(--z));min-height:calc(44px*var(--z));color:var(--muted)}
#pop{position:fixed;display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:30;padding:4px;min-width:200px}
#pop.on{display:block}

<body>
<header>
  <button id="list-name" class="list-name" title="Switch list"><span id="list-label">…</span><span class="caret">▾</span><span id="od-head" class="od-badge" hidden></span></button>
  <span class="spacer"></span>
  <span class="ver" id="ver" title="Build"></span>
  <button id="stat" class="stat off" title="">○</button>
  <button id="app-menu" class="icon" title="Menu">⋯</button>
</header>
<div id="ro-bar" class="srch-bar ro-bar" hidden><span id="ro-text"></span><button id="ro-reload" title="Reload to get the latest version">Reload</button></div>
<div id="srch-bar" class="srch-bar" hidden><span id="srch-text"></span><button id="srch-clear" title="Clear the search">✕ Clear</button></div>

<main>
  <div id="ptr"><span id="ptr-text">Pull to refresh</span></div>
  <div id="scroller"><div id="rows"></div></div>
  <button id="snap" hidden title="Back to the start of the titles">⇤</button>
</main>
<footer id="quick"><input id="qa" type="text" placeholder="Add a task…" enterkeyhint="done" autocomplete="off"><button id="qa-list" class="qa-chip" title="Folder for new tasks" hidden></button><button id="qa-date" class="qa-chip" title="Due date for new tasks" hidden></button></footer>

<aside id="drawer" aria-label="Task editor">
  <div class="d-head">
    <button id="d-close" class="ghost" title="Close (Esc)">✕</button>
    <strong class="d-title" style="flex:1">Edit task</strong>
    <span class="dirty" id="d-dirty">● unsaved</span>
    <button id="d-mode" title="Switch between formatted and raw Markdown">Raw</button>
    <button id="d-save" class="primary" disabled>Save</button>
    <button id="d-saveclose" class="btn-green" title="Save and close the editor">Save &amp; close</button>
  </div>
  <div class="d-fields">
    <label class="wide">Title<input type="text" id="f-title"></label>
    <label>Prefix<select id="f-prefix">
      <option value="checkbox">☐ checkbox</option><option value="bullet">• bullet</option><option value="none">none</option></select></label>
    <label>Status<select id="f-status"></select></label>
    <label>Folder<select id="f-list"></select></label>
    <label>Due<span class="due-wrap"><input type="date" id="f-due"><button type="button" id="f-due-clear" title="Clear the due date" aria-label="Clear the due date" hidden>✕</button></span></label>
    <label class="wide">Repeat<span style="display:flex;gap:6px"><select id="f-rep" style="flex:0 0 auto">
      <option value="">Doesn't repeat</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option>
      <option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option>
      <option value="yearly">Yearly</option><option value="custom">Custom…</option></select>
      <input type="text" id="f-rep-custom" placeholder="e.g. every 3 days · weekly on mon, thu · monthly on last day" style="flex:1;min-width:0;display:none"></span></label>
    <label class="rep-opt">Mode<select id="f-rep-mode"><option value="recycle">Recycle (same file)</option><option value="copy">Copy (keep a record)</option></select></label>
    <label class="rep-opt">Next date<select id="f-rep-next"><option value="skip">Skip missed</option><option value="catchup">Catch up</option><option value="afterdone">From completion</option></select></label>
    <div class="wide d-note rep-opt" id="f-rep-hint"></div>
    <label class="wide">Collections<input type="text" id="f-coll" placeholder="a, b"></label>
  </div>
  <div class="d-note" id="d-parent"></div>
  <div class="d-note warn" id="d-unknown"></div>
  <div class="d-banner" id="d-auth">Your sign-in expired — your edit is still here. <button id="d-signin">Sign in</button> then save.</div>
  <div class="d-banner" id="d-banner">This file changed elsewhere while you were editing (Claude or another device?). <button id="d-loaddisk">Load that version</button> — or keep editing; Save will ask before overwriting.</div>
  <div id="editor-wrap"><div id="editor"></div></div>
  <div class="d-checklist" id="d-checklist"></div>
  <div class="d-foot">
    <span class="file" id="d-file"></span>
    <button id="d-sub">+ Subtask</button>
    <button id="d-demote">Demote into…</button>
    <button id="d-delete" class="danger">Delete</button>
  </div>
</aside>

<div id="modal-bg"><div id="modal" role="dialog" aria-modal="true" tabindex="-1"></div></div>

<script>
"use strict";
/* =====================================================================
   HTML-ToDo-App — one Markdown file per task, YAML frontmatter for fields.
   Data contract (frontmatter keys, in this order):
     id, title, status, prefix, list, collections, parent, order, due, completed, demoted_into
   Unknown keys are preserved untouched (and flagged with ⚠). _todo.json holds
   {"format": 2, "lists": [...]} plus any keys it already had.
   Specs: docs/specs/storage-spec.md (storage) and round-1-spec.md R1-12 (list view).
   ===================================================================== */
const APP_VERSION = '0.2.0-dev';
const BUILD = '2026-11-08c';            // bump on every build — shown in Settings so we can tell which version a device runs
const DATA_FORMAT = 4;   // 3 adds repeat + series (R2-1); 4 = folders (R2-5): the folder is where a task is, no list: line
const CONFIG_FILE = '_todo.json';
const KNOWN = ['id','title','status','prefix','collections','parent','order','due','repeat','series','completed','demoted_into'];
const STATUSES = ['open','active','done','archived'];
const PREFIXES = ['checkbox','bullet','none'];
const DEFAULT_CLIENT_ID = '18f50dc2-e8ba-4b12-8735-1cf7d6c873cd';   // Azure registration "HTML-ToDo-App PoC" (not a secret)
const DEFAULT_FOLDER = 'HTML-ToDo-App';
const LOCAL_FOLDER = 'data';             // R2-4: from disk, the task folder sits next to the build folder: <root>\data
const GRAPH = 'https://graph.microsoft.com/v1.0';
const SCOPES = ['Files.ReadWrite', 'User.Read'];
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');
/* Phone or PC? (R1-15) The browser's label says "phone" normally, but Chrome's "Desktop site" mode sends a PC label.
   So also check the hardware: touch-only (no mouse/trackpad) + a phone-sized screen = phone. Touch laptops have a
   trackpad or mouse, so they stay PCs. R2-6: some Android phones report a fine pointer too (any-pointer: fine), but
   nothing on them can hover, while a laptop's trackpad or mouse always can — so "touch + nothing hovers" also counts. */
const MOBILE_UA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || navigator.userAgentData?.mobile === true;
const TOUCH_ONLY = matchMedia('(pointer: coarse)').matches &&
  (!matchMedia('(any-pointer: fine)').matches || (navigator.maxTouchPoints > 0 && !matchMedia('(any-hover: hover)').matches));
const PHONE_SCREEN = Math.min(screen.width, screen.height) <= 600;   // phones are ~360–480 px on the short side
const IS_PHONE = MOBILE_UA || (TOUCH_ONLY && PHONE_SCREEN);
/* Phone in Chrome's "Desktop site" mode: Chrome lays the page out ~980 px wide, so everything looks tiny.
   Scale the page back up so it fits the phone's real screen width. */
const DESKTOP_SITE_ON_PHONE = IS_PHONE && !MOBILE_UA && innerWidth > screen.width * 1.3;
const PAGE_ZOOM = DESKTOP_SITE_ON_PHONE ? innerWidth / screen.width : 1;
if (PAGE_ZOOM !== 1) document.documentElement.style.zoom = String(PAGE_ZOOM);
document.documentElement.classList.toggle('phone', IS_PHONE);
/* R2-6 diagnostics: what the browser reports and what the app decided (⋯ → Settings → Diagnostics). A short line
   is logged on every load and every return to the screen, so an overnight switch to desktop mode leaves a trace. */
function deviceReport(){
  const mq = q => matchMedia(q).matches, nav = performance.getEntriesByType?.('navigation')?.[0];
  return {
    time: new Date().toISOString(), build: BUILD,
    decided: { phone: IS_PHONE, mobileLabel: MOBILE_UA, touchOnly: TOUCH_ONLY, phoneScreen: PHONE_SCREEN, desktopSiteOnPhone: DESKTOP_SITE_ON_PHONE, zoom: +PAGE_ZOOM.toFixed(3) },
    now: { mobileLabel: /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent), uaMobile: navigator.userAgentData?.mobile ?? null, uaPlatform: navigator.userAgentData?.platform ?? null,
      pointerCoarse: mq('(pointer: coarse)'), pointerFine: mq('(pointer: fine)'), anyPointerFine: mq('(any-pointer: fine)'), anyPointerCoarse: mq('(any-pointer: coarse)'),
      hover: mq('(hover: hover)'), anyHover: mq('(any-hover: hover)'), maxTouchPoints: navigator.maxTouchPoints },
    sizes: { screen: screen.width + '×' + screen.height, avail: screen.availWidth + '×' + screen.availHeight, inner: innerWidth + '×' + innerHeight,
      outer: outerWidth + '×' + outerHeight, visualViewport: window.visualViewport ? Math.round(visualViewport.width) + '×' + Math.round(visualViewport.height) : null,
      dpr: devicePixelRatio, orientation: screen.orientation?.type ?? null },
    page: { installedApp: mq('(display-mode: standalone)'), visible: document.visibilityState, load: nav?.type ?? null, wasDiscarded: !!document.wasDiscarded },
    userAgent: navigator.userAgent,
  };
}
function logDevice(why){
  try { const r = deviceReport(); const line = `${r.time.slice(5, 16).replace('T', ' ')} ${why}: ${r.decided.phone ? 'PHONE' : 'PC'} zoom ${r.decided.zoom}` +
      ` · label ${r.now.mobileLabel ? 'mobile' : 'desktop'} · coarse ${r.now.pointerCoarse} fine ${r.now.anyPointerFine} · screen ${r.sizes.screen} inner ${r.sizes.inner} · ${r.page.installedApp ? 'app' : 'tab'} ${r.page.load}${r.page.wasDiscarded ? ' (discarded)' : ''}`;
    pushLog(line); } catch {}
}
function logNote(msg){ try { pushLog(`${new Date().toISOString().slice(5, 16).replace('T', ' ')} ${msg}`); } catch {} }   // sign-in steps (R2-6 C)
function pushLog(line){ const log = JSON.parse(localStorage.getItem('todo.deviceLog') || '[]'); log.push(line);
  localStorage.setItem('todo.deviceLog', JSON.stringify(log.slice(-40))); }
logDevice('load');
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') logDevice('back'); });
const DEVICE = IS_PHONE ? 'Phone' : 'PC';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch{ return d; } },
             set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
             del(k){ try{ localStorage.removeItem(k); }catch{} } };
const POLL_MS = ls.get('todo.pollMs', IS_PHONE ? 10000 : 5000);   // S-4: ~10 s phone, ~5 s PC
const TEXT_SIZES = [100, 125, 150, 175];
function textSize(){ return ls.get('todo.textSize', IS_PHONE ? 125 : 100); }   // R1-4: per device; phones default 125%
function applyTextSize(pct){ document.documentElement.style.setProperty('--z', String(pct / 100)); if (typeof fitListName === 'function' && document.readyState !== 'loading') fitListName(); }
applyTextSize(textSize());

const S = {
  tasks: new Map(), lists: [], tooNew: 0, cfgVersion: null, cfgExtra: {}, store: null, auth: null,
  view: ls.get('todo.view2', 'list'), list: ls.get('todo.list', ''), showDone: ls.get('todo.showDone', false), showArchived: false, q: '',
  expanded: new Set(ls.get('todo.expanded', [])), editing: null, snapshot: null, addSub: null,
  busy: 0, syncing: false, offline: false, conflict: false, signedOut: false, redirecting: false, editor: null,
};

/* ---------------- errors ---------------- */
class ConflictError extends Error { constructor(path){ super('Changed elsewhere: ' + path); this.path = path; } }
class ExistsError extends Error { constructor(path){ super('Already exists: ' + path); this.path = path; } }
class NotFoundError extends Error { constructor(path){ super('Not found: ' + path); this.path = path; } }
class OfflineError extends Error {}
class AuthError extends Error {}
class FolderError extends Error {}
class ReadOnlyError extends Error {}               // R2-5 step 0: the folder needs a newer build

/* ---------------- storage connectors (storage-spec S-2) ----------------
   Every store: list() → [{path, version}], read(path) → {text, version},
   write(path, text, expected) → version (ConflictError if the file moved on or vanished),
   create(path, text) → version (ExistsError if taken), remove(path, expected),
   changes() → [{path, version?, deleted?}] since the previous call (first call = baseline).
   `path` is relative to the location's folder; `version` is opaque (compare for equality only).
   R2-5 folders: move(from, to, expected) → version (ConflictError / ExistsError), folders() → folder paths known from
   the last listing or check (null = not known yet), createFolder(path), renameFolder(path, newPath), removeFolder(path)
   (only when empty). */
function baseName(p){ return String(p).split('/').pop(); }
const TRASH = '.trash';                       // R2-8 Deleted A: the hidden trash folder inside the task folder (every store)
/* R2-5 folders: a task's folder is the folder its file is in ('' = the task folder itself, shown as "/ (root)").
   Paths use '/', so a tree of folders only needs MAX_DEPTH raised; one level for now. Names starting with . or _ are
   hidden/system (e.g. .trash) and never folders of tasks. */
const MAX_DEPTH = 1;
function dirOf(p){ const s = String(p), i = s.lastIndexOf('/'); return i < 0 ? '' : s.slice(0, i); }
const joinPath = (dir, name) => dir ? dir + '/' + name : name;
const hiddenSeg = s => /^[._]/.test(s);
function isFolderPath(d){ const segs = String(d).split('/'); return !!d && segs.length <= MAX_DEPTH && !segs.some(s => !s || hiddenSeg(s)); }
/* A task file: .md, not _/. named, not README, at most MAX_DEPTH folders down, and never inside a hidden folder such as
   .trash (checked per path segment) */
function isTaskPath(p){ const segs = String(p).split('/'), n = segs.pop();
  return /\.md$/i.test(n) && !/^[_.]/.test(n) && !/^readme\.md$/i.test(n) && segs.length <= MAX_DEPTH && !segs.some(s => !s || hiddenSeg(s)); }
function isStorePath(p){ return p === CONFIG_FILE || isTaskPath(p); }
async function listDiff(store){             // changes() for stores without a native change feed
  const now = new Map((await store.list()).map(e => [e.path, e.version]));
  const prev = store._snap; store._snap = now; if (!prev) return [];
  const out = [];
  for (const [p, v] of now) if (prev.get(p) !== v) out.push({ path:p, version:v });
  for (const p of prev.keys()) if (!now.has(p)) out.push({ path:p, deleted:true });
  return out;
}

class MemStore {
  constructor(files){ this.name = 'Demo data'; this.kind = 'demo'; this.demo = true; this.tick = 1; this.files = new Map();
    this.caps = { trueConditionalWrite:true, recoverableDelete:true, trash:TRASH, watch:'list' };
    for (const [n, t] of Object.entries(files)) this.files.set(n, { text:t, version:'m' + this.tick++ }); }
  async list(){ return [...this.files].filter(([p]) => isStorePath(p)).map(([path, f]) => ({ path, version:f.version })); }

/* ---------------- task helpers ---------------- */

/* ---------------- status icon ---------------- */

  if (!S.store){ s = S.signedOut ? 'signedout' : 'off'; tip = S.signedOut ? 'Not signed in' : 'No folder open'; }
  else if (S.offline){ s = 'offline'; tip = 'Offline — changes can\'t be saved'; }
  else if (S.signedOut){ s = 'signedout'; tip = 'Signed out — tap to sign in'; }
  else if (S.conflict){ s = 'conflict'; tip = 'A file changed elsewhere — see the dialog'; }
  else if (S.busy || S.syncing){ s = 'sync'; tip = 'Syncing…'; }
  else { s = S.store.kind === 'demo' ? 'demo' : S.store.kind === 'local' ? 'local' : 'ok';
         tip = S.store.kind === 'demo' ? 'Demo data — not saved' : S.store.kind === 'local' ? 'Local folder: ' + S.store.name : 'Signed in' + (S.auth?.user() ? ' as ' + S.auth.user() : '') + ' · ' + S.store.name; }
  if (window.__NETLOCK__) tip += ' · network locked (no connections)';

  el.textContent = { ok:'●', local:'●', sync:'⟳', offline:'⚠', signedout:'○', conflict:'!', demo:'◌', off:'○' }[s];
  el.title = tip; el.dataset.state = s;

function busy(d){ S.busy = Math.max(0, S.busy + d); setStat(); }
function storeError(e, what){

  if (e instanceof AuthError){ reauth(); return; }
  if (e instanceof FolderError){ toast(e.message); return; }
  if (e instanceof ReadOnlyError){ toast(`Read-only: this folder needs a newer version of the app — ${what || 'change'} not saved. Tap Reload.`); return; }

async function pool(items, n, fn){ const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length){ const k = i++; out[k] = await fn(items[k], k); } }));
  return out; }

  busy(1);

    const entries = await S.store.list();             // with the device copy: checks the copy, downloads only what changed
    const recs = [];
    await pool(entries, 6, async e => {               // S-8 C: parallel reads, ~6 at a time
      try { const { text, version } = await S.store.read(e.path, { cached:true }); recs.push({ path:e.path, text, version }); }
      catch (err){ console.warn('read failed', e.path, err); }

  const fresh = get(S.editing) || byFile(old.file);

  if (fresh && fresh.version === old.version) return;

  const before = [t, ...descendants(t.id)].map(x => ({ id:x.id, parent:x.parent, order:x.order, list:x.list }));
  const siblingsOf = parentId => (parentId ? kids(parentId) : all().filter(x => x.list === t.list && !hasParent(x)).sort(byOrder)).filter(x => x.id !== t.id);

    const back = before.map(s => { const x = get(s.id); if (x) Object.assign(x, { parent:s.parent, order:s.order, list:s.list }); return x; }).filter(Boolean);
    render(); await saveMany(back.filter(x => !x.isNew)); render();

}

/* Recycle: the same file moves to the next date; everything unchecked (task, subtasks, notes); nothing logged */
async function recycleTask(t, r){
  const fam = [t, ...descendants(t.id).filter(d => d.status !== 'archived' && STATUSES.includes(d.status))];
  const before = fam.map(x => ({ id:x.id, status:x.status, completed:x.completed, body:x.body, due:x.due }));
  const next = nextDue(r, t.due);

   notes), so a later save can't write the old notes back (T2-1). A drawer edited meanwhile keeps its text; the banner
   offers the saved version. */
function syncEditorStatus(tasks){ const t = tasks.find(x => x.id === S.editing); if (!t || get(S.editing) !== t) return;
  if (!isDirty()){ fillDrawer(t); return; }
  fillStatusSelect(t.status); $('#f-status').value = t.status; updateSnapshotField('status', t.status);
  if ((t.body || '') !== S.snapshot.body){ t.diskChanged = true; $('#d-banner').classList.add('on'); } }

/* Undo bar: 5 s (deletes 15 s, R2-8 Deleted D), one at a time (a new action replaces the previous offer) */
let undoTimer = null, undoFn = null;
function showUndo(msg, fn, ms = 5000){
  clearTimeout(undoTimer); undoFn = fn;
  $('#undo-msg').textContent = msg; $('#undo').classList.add('on');
  undoTimer = setTimeout(hideUndo, ms);
}
function hideUndo(){ clearTimeout(undoTimer); undoFn = null; $('#undo').classList.remove('on'); }
$('#undo-btn').onclick = async () => { if (S.editing && isDirty()) return toast('Save or close the open editor first.');   // T2-1: Undo rewrites notes too
  const fn = undoFn; hideUndo(); if (fn){ await fn(); toast('Undone'); } };

function popover(anchor, items){
  const pop = $('#pop');
  pop.innerHTML = items.map((it, i) => it.sep ? '<div class="sep"></div>' : it.hdr ? `<div class="phdr">${esc(it.hdr)}</div>` : `<button data-i="${i}" class="${it.danger?'danger':''}">${esc(it.label)}</button>`).join('');
  pop.classList.add('on');
  const Z = PAGE_ZOOM, b = anchor.getBoundingClientRect();            // screen units → page units when scaled (R1-15)
  const r = { bottom: b.bottom / Z, right: b.right / Z }, vw = innerWidth / Z, vh = innerHeight / Z;
  pop.style.top = Math.max(8, Math.min(r.bottom + 4, vh - pop.offsetHeight - 8)) + 'px';
  pop.style.left = Math.max(8, Math.min(r.right - pop.offsetWidth, vw - pop.offsetWidth - 8)) + 'px';
  pop.onclick = ev => { const b = ev.target.closest('button[data-i]'); if (!b) return; pop.classList.remove('on'); items[+b.dataset.i].fn(); };
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('#pop') && !e.target.closest('[data-act=menu]') && !e.target.closest('#app-menu')) $('#pop').classList.remove('on'); });

function rowMenu(t, anchor){

  if (t.parent) items.push({ label:'Move to top level', fn: async () => { t.parent = ''; t.order = nextOrder(all().filter(x => x.list === t.list && !hasParent(x))); await saveTask(t); render(); } });
  items.push({ sep:true }, { label:'Delete…', danger:true, fn:() => deleteDialog(t) });
  popover(anchor, items);
}
/* R2-5: Move to folder… moves the task's file and its whole family's (decision 4). A subtask on its own can't leave its
   parent's folder: Cancel, or make it a top-level task there (decision 5). */
function moveToListDialog(t){
  modal(`<h3>Move “${esc(t.title)}” to folder</h3>${S.lists.map(l => `<div class="pick ${l===t.list?'on':''}"><button class="go" data-a="l:${esc(l)}">${esc(fname(l))}</button></div>`).join('')}
    <div class="btns"><button data-a="cancel">Cancel</button></div>`,
    async a => { closeModal(); if (!a.startsWith('l:')) return; const l = a.slice(2); if (l === t.list) return;
      if (hasParent(t)) return modal(`<h3>Move a subtask?</h3><p>A subtask stays in its parent's folder. Move <b>${esc(t.title)}</b> to <b>${esc(fname(l))}</b> as a top-level task there${descendants(t.id).length ? ', with its own subtasks' : ''}?</p>
          <div class="btns"><button data-a="cancel">Cancel</button><button class="primary" data-a="ok">Make it a top-level task in ${esc(fname(l))}</button></div>`,
        async b => { closeModal(); if (b !== 'ok') return; t.parent = ''; await moveFamily(t, l); });
      await moveFamily(t, l); }, { sheet:true });
}
async function moveFamily(t, l){
  const changed = [t, ...descendants(t.id)]; changed.forEach(x => x.list = l);
  t.order = nextOrder(all().filter(x => x.list === l && !hasParent(x) && x.id !== t.id));
  const ok = await saveMany(changed.filter(x => !x.isNew)); syncLists(); render(); if (ok) toast(`Moved to “${fname(l)}”`);
}
function prefixDialog(t){
  const cur = prefixOf(t);
  modal(`<h3>Prefix for “${esc(t.title)}”</h3>
    ${[['checkbox','☐ Checkbox — tap to check off'],['bullet','• Bullet — a note, not a to-do'],['none','None — just the title']].map(([v,l]) =>
      `<div class="pick ${v===cur?'on':''}"><button class="go" data-a="p:${v}">${l}</button></div>`).join('')}
    <div class="btns"><button data-a="cancel">Cancel</button></div>`,
    async a => { closeModal(); if (!a.startsWith('p:')) return; const v = a.slice(2); if (v === cur) return;
      t.prefix = v; if (!t.isNew) await saveTask(t); render(); }, { sheet:true });
}
const dueText = d => isYmd(d) ? niceDate(d) : String(d);
function deleteDialog(t){
  const subs = descendants(t.id);
  const where = !S.store ? '' : ' A copy is kept in <b>Recently deleted</b> (⋯ menu), so it can be restored.' +
    (S.store.kind === 'onedrive' ? ' OneDrive\'s recycle bin has it too.' : '');
  const MAX = 10;                                 // R2-8 Deleted D: name the subtasks (with due dates), not just a count
  const subList = subs.length ? `<ul class="dl-subs">${subs.slice(0, MAX).map(s => `<li>${esc(s.title)}${s.due ? ` <span class="dl-sdue">· due ${esc(dueText(s.due))}</span>` : ''}</li>`).join('')}${subs.length > MAX ? `<li class="dl-more">and ${subs.length - MAX} more</li>` : ''}</ul>` : '';
  modal(`<h3>Delete task?</h3><p><b>${esc(t.title)}</b> — <code>${esc(t.file || '(unsaved)')}</code> will be deleted.${where}</p>
    ${t.due ? `<p class="dl-due">This task is due <b>${esc(dueText(t.due))}</b>.</p>` : ''}
    ${subs.length ? `<p><b>Also delete its ${subs.length} subtask${subs.length>1?'s':''}?</b></p>${subList}` : ''}
    <div class="btns"><button data-a="cancel">Cancel</button><button class="primary danger" data-a="ok">${subs.length ? 'Delete all' : 'Delete'}</button></div>`,
    async a => { closeModal(); if (a !== 'ok') return;
      if (S.editing && [t, ...subs].some(x => x.id === S.editing)) closeDrawer(true);
      const gone = [];
      for (const x of [...subs].reverse().concat(t)){          // subtasks first, the parent last
        const text = x.isNew ? null : (x.raw ?? serializeTask(x));      // the exact file, so Undo rebuilds it byte for byte
        const r = await removeTask(x);
        if (r){ if (text) gone.push({ file:x.file, text, trash:r.trash }); } else break;
      }
      render();
      if (!gone.length) return;
      showUndo(gone.length > 1 ? `Deleted “${t.title}” and ${gone.length - 1} subtask${gone.length>2?'s':''}` : `Deleted “${t.title}”`, async () => {
        busy(1);
        try {
          for (const g of gone.reverse()){
            let file = g.file;
            for (let i = 0; ; i++){
              try { const v = await S.store.create(file, g.text); addParsed(S.tasks, parseTask(file, g.text, v)); break; }
              catch (e){ if (e instanceof ExistsError && i < 5){ file = uniqueFile(baseName(g.file).replace(/\.md$/i, ''), '', [file]); continue; } throw e; }
            }
            if (g.trash) try { await trashDrop(g.trash); } catch (e){ console.warn('trash entry not removed', e); }   // restored → no longer "deleted"
          }
        } catch (e){ storeError(e, 'undo'); } finally { busy(-1); syncLists(); render(); }
      }, 15000);
    });
}

/* R2-5 decision 10: rename a folder (one store operation; the files keep their names), or delete it only when empty */
function renameListDialog(l){
  const empty = !all().some(t => t.list === l);
  modal(`<h3>Folder “${esc(l)}”</h3><input type="text" id="m-name" value="${esc(l)}"><p class="m-err" id="m-err"></p>
    <p style="font-size:12px;color:var(--muted)">${empty ? 'Empty — it can be deleted.' : 'Only an empty folder can be deleted: move or delete its tasks first.'}</p>
    <div class="btns">${empty ? '<button class="danger" data-a="remove">Delete folder</button>' : ''}<button data-a="cancel">Cancel</button><button class="primary" data-a="ok">Rename</button></div>`,
    async a => {
      if (a === 'remove'){ closeModal(); if (all().some(t => t.list === l)) return toast('It isn\'t empty any more.');
        busy(1); try { await S.store.removeFolder(l); } catch (e){ if (!(e instanceof NotFoundError) && e.status !== 404){ busy(-1); return storeError(e, 'delete folder'); } } busy(-1);
        S.lists = S.lists.filter(x => x !== l); if (S.list === l){ S.list = ''; ls.set('todo.list', ''); } await saveConfig(); render(); toast(`Deleted the folder “${l}”`); return; }
      if (a !== 'ok') return closeModal(); const n = $('#m-name').value.trim(); if (!n || n === l) return closeModal();
      const err = folderNameError(n, l); if (err){ $('#m-err').textContent = err; return; }
      closeModal(); busy(1);
      try { await S.store.renameFolder(l, n); }
      catch (e){ busy(-1); return e instanceof ExistsError ? toast('A folder with that name exists.') : storeError(e, 'rename folder'); }
      busy(-1);
      S.lists = S.lists.map(x => x === l ? n : x); if (S.list === l){ S.list = n; ls.set('todo.list', n); }
      if (S.editing) closeDrawer(true);
      await loadAll(); await saveConfig(); render(); toast(`Renamed to “${n}”`); });
  setTimeout(() => $('#m-name')?.select(), 0);

function addListDialog(after){

    <div class="btns"><button data-a="cancel">Cancel</button><button class="primary" data-a="ok">Add</button></div>`,
    async a => { if (a !== 'ok') return closeModal(); const n = $('#m-name').value.trim();

      closeModal(); busy(1);

function newTask({ list, parent } = {}){
  const p = parent ? get(parent) : null;
  const l = p ? p.list : (list != null ? list : S.view === 'list' ? S.list : '');
  const siblings = p ? kids(p.id) : all().filter(x => x.list === l && !hasParent(x));
  const t = { file:'', version:null, id:newId(), title:'', status:'open', prefix:'', list:l, collections:[], parent: p ? p.id : '',
    order: nextOrder(siblings), due:'', completed:'', demoted_into:'', body:'', extra:{}, unknown:[], isNew:true };
  S.tasks.set(t.id, t);
  if (p && !S.expanded.has(p.id)){ S.expanded.add(p.id); persistExpanded(); }

}

/* Toolbar (R1-12 #17, #18): always Checklist, Bullet, Outdent, Indent, Inline code … More. On a PC, as many of the
   EXTRAS as fit go between them (in this order); whatever doesn't fit is listed under More, grouped by type. */
const TB_PRIMARY = ['task','ul','outdent','indent','code'];
const TB_EXTRAS = ['bold','italic','strike','heading','ol','link','quote','hr','table','codeblock'];
const MORE_GROUPS = [
  ['Text style', [['bold','Bold',() => edExec('bold')], ['italic','Italic',() => edExec('italic')], ['strike','Strikethrough',() => edExec('strike')]]],
  ['Headings', [['heading','Heading 1',() => edExec('heading', { level:1 })], ['heading','Heading 2',() => edExec('heading', { level:2 })], ['heading','Heading 3',() => edExec('heading', { level:3 })]]],
  ['Lists', [['ol','Numbered list',() => edExec('orderedList')]]],
  ['Insert', [['link','Link…',() => linkDialog()], ['quote','Quote',() => edExec('blockQuote')], ['hr','Horizontal line',() => edExec('hr')],
              ['table','Table…',() => tableDialog()], ['codeblock','Code block',() => edExec('codeBlock')]]],
];
S.tbShown = new Set();   // extras currently on the toolbar
function editorToolbar(){
  const extras = IS_PHONE ? [] : [...TB_EXTRAS];                      // PC: start with all extras; fitToolbar() trims to what fits
  S.tbShown = new Set(extras);
  const more = { name:'appMore', tooltip:'More', el: phoneMoreButton() };
  const big = { name:'appExpand', tooltip:'Bigger notes', el: expandButton() };
  return extras.length ? [TB_PRIMARY, extras, [more, big]] : [[...TB_PRIMARY, more, big]];
}
/* PC: if the library starts hiding buttons (its own ⋯ appears), remove extras from the END until everything fits */
const libOverflow = () => [...document.querySelectorAll('#editor .toastui-editor-toolbar-icons.more')].some(b => b.offsetWidth > 0);
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
async function fitToolbar(){
  if (IS_PHONE || !S.editor) return;
  await nextFrame();
  for (const name of [...TB_EXTRAS].reverse()){
    if (!libOverflow()) break;
    if (!S.tbShown.has(name)) continue;
    S.editor.removeToolbarItem(name); S.tbShown.delete(name);
    await nextFrame();
  }
}
window.addEventListener('resize', () => { if (S.editing) fitToolbar(); });

  const groups = MORE_GROUPS.map(([h, items]) => [h, items.filter(([key]) => !S.tbShown.has(key))]).filter(([, items]) => items.length);
  const use = groups.length ? groups : MORE_GROUPS;                  // everything fits → More still offers the full menu
  popover(anchor, use.flatMap(([h, items]) => [{ hdr:h }, ...items.map(([, label, fn]) => ({ label, fn }))]));
}

/* ---------------- checklist items: parse / promote ---------------- */
// Top-level checkbox items in a body, each with its nested block (more-indented lines that follow).
function checklistBlocks(md){

    const m = lines[i].match(CK_RE); if (!m || m[1].length !== 0) continue;
    let j = i + 1; const nested = [];

      const l = lines[j];
      if (l.trim() === ''){ // blank line belongs to the block only if an indented line follows
        let k = j + 1; while (k < lines.length && lines[k].trim() === '') k++;
        if (k < lines.length && /^\s+\S/.test(lines[k])){ for (; j < k; j++) nested.push(''); continue; } break;
      }
      if (/^\s+\S/.test(l)){ nested.push(l); j++; } else break;
    }
    out.push({ start:i, end:j, checked: m[2] !== ' ', text: m[3], nested });
  }
  return out;
}
let ckTimer = null;

  $('#d-checklist').style.display = blocks.length ? '' : 'none';
  $('#d-checklist').innerHTML = `<h4>Checklist items — promote one to its own task file</h4>` + blocks.map((b, i) =>
    `<div class="ck-item ${b.checked?'checked':''}"><span>${esc(stripInline(b.text).title)}</span>${linkedFile(b.text) ? '<span class="chip" style="flex:0">archived file</span>' : ''}<button data-i="${i}">↑ Promote</button></div>`).join('');

$('#d-checklist').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) promote(+b.dataset.i); });
const LINK_RE = /\s*\[[^\]]*\]\(([^)\s]+\.md)\)/;

function linkTo(path){ return path.split('/').map(encodeURIComponent).join('/'); }   // S-11: encode each path segment
function stripInline(text){

  s = s.replace(/(^|\s)#([\w-]+)/g, (_, sp, tag) => { tags.push(tag); return ''; });
  return { title: s.replace(/\*\*/g,'').trim() || 'Untitled', due, tags };

  const file = linkedFile(b.text);

/* ---------------- demote ---------------- */
function demoteLines(t, o, indent){
  const box = `${indent}- [${t.status === 'done' ? 'x' : ' '}] ${t.title.replace(/\n/g,' ')}`;
  let line = box;
  if (o.level >= 2){ if (t.due) line += ` 📅 ${t.due}`; for (const c of t.collections) line += ` #${c.replace(/\s+/g,'-')}`; }
  if (o.keep) line += ` [↗](${linkTo(baseName(t.file))})`;     // R2-5: the kept file moves into the target's folder, so the link is a name there
  const out = [line];
  if (o.level >= 3){
    const body = (t.body || '').trim();
    if (body) for (const l of body.split('\n')) out.push(l.trim() ? indent + '  ' + l.replace(/^(#{1,6})\s+(.*)$/, '**$2**') : '');
  }
  if (o.kids === 'demote') for (const c of kids(t.id)) out.push(...demoteLines(c, o, indent + '  '));
  return out;
}
function demoteDialog(t){
  const blocked = new Set([t.id, ...descendants(t.id).map(d => d.id)]);
  const targets = all().filter(x => !blocked.has(x.id) && x.status !== 'archived' && !x.isNew).sort((a,b) => a.list.localeCompare(b.list) || byOrder(a,b));
  if (!targets.length) return toast('No other task to demote into.');
  const defTarget = hasParent(t) ? t.parent : (targets.find(x => x.list === t.list && !hasParent(x)) || targets[0]).id;
  const nk = descendants(t.id).length;
  modal(`<h3>Demote “${esc(t.title)}” to a checklist item</h3>
    <label style="font-size:12px;color:var(--muted)">Into task</label>
    <select id="m-target">${targets.map(x => `<option value="${esc(x.id)}" ${x.id===defTarget?'selected':''}>${esc(fname(x.list))} › ${esc(x.title)}</option>`).join('')}</select>
    <fieldset class="opts"><legend>What to carry into the checklist line</legend>
      <label><input type="radio" name="lvl" value="1"> <span><b>Title only</b> — fastest; notes and fields are dropped from the line.</span></label>
      <label><input type="radio" name="lvl" value="2"> <span><b>Title + details</b> — due date and collections inline (<code>📅 2026-10-20 #rental</code>).</span></label>
      <label><input type="radio" name="lvl" value="3" checked> <span><b>Title + details + notes</b> — the task's Markdown body is nested under the checkbox (headings become bold).</span></label>
    </fieldset>
    <fieldset class="opts"><legend>The original file</legend>
      <label><input type="checkbox" id="m-keep" checked> <span><b>Keep it, archived</b> — status becomes <code>archived</code>, <code>demoted_into</code> points at the target, and the checkbox links to it. “Promote” later restores every field. Uncheck to delete the file.</span></label>
      <div class="dm-warn" id="m-duewarn"></div>
    </fieldset>
    ${nk ? `<fieldset class="opts"><legend>Its ${nk} subtask(s)</legend>
      <label><input type="radio" name="kids" value="move" checked> <span>Move them under the target as real tasks</span></label>
      <label><input type="radio" name="kids" value="demote"> <span>Demote them too, as nested checkboxes</span></label></fieldset>` : ''}
    <div style="font-size:12px;color:var(--muted)">Will be appended to the target's notes:</div><pre id="m-preview"></pre>
    <div class="btns"><button data-a="cancel">Cancel</button><button class="primary" data-a="ok">Demote</button></div>`,
    async a => { if (a !== 'ok') return closeModal(); const o = opts(); closeModal(); await doDemote(t, get(o.target), o); });
  const opts = () => ({ target: $('#m-target').value, level: +document.querySelector('input[name=lvl]:checked').value,
    keep: $('#m-keep').checked, kids: document.querySelector('input[name=kids]:checked')?.value || 'move' });
  /* R2-8 Deleted C: a due-dated task (or a due-dated subtask demoted with it) is always kept, archived and restorable */
  const guard = () => { const due = demoteDue(t, opts().kids), k = $('#m-keep');
    if (due.length){ k.checked = true; k.disabled = true; } else k.disabled = false;
    $('#m-duewarn').innerHTML = due.slice(0, 5).map(x => `<p>${x === t ? 'This task is' : `“${esc(x.title)}” is`} due <b>${esc(dueText(x.due))}</b> — it will leave the Today view.</p>`).join('') +
      (due.length > 5 ? `<p>…and ${due.length - 5} more due-dated subtasks.</p>` : '') + (due.length ? '<p class="dm-kept">So the file is kept (archived), and Promote brings it back.</p>' : ''); };
  const prev = () => { guard(); $('#m-preview').textContent = demoteLines(t, opts(), '').join('\n'); };
  $('#modal').addEventListener('input', prev); prev();
}
function demoteDue(t, kids){ return [t, ...(kids === 'demote' ? descendants(t.id) : [])].filter(x => x.due); }
async function doDemote(t, target, o){
  if (!target) return;
  if (demoteDue(t, o.kids).length) o.keep = true;              // R2-8 Deleted C: never delete a due-dated task by demoting it
  const tree = o.kids === 'demote' ? descendants(t.id) : [];
  const lines = demoteLines(t, o, '');
  const changed = [];
  // 1) append to the target's body
  const body = (target.body || '').replace(/\s+$/, '');
  const last = body.split('\n').pop();
  const sep = body ? ((CK_RE.test(last) || /^\s+\S/.test(last)) ? '\n' : '\n\n') : '';
  target.body = normBody(body + sep + lines.join('\n'));
  changed.push(target);
  // 2) subtasks not demoted move under the target
  if (o.kids !== 'demote') for (const c of kids(t.id)){ c.order = nextOrder(kids(target.id)); c.parent = target.id; c.list = target.list;
    changed.push(c); for (const d of descendants(c.id)){ d.list = target.list; changed.push(d); } }
  // 3) the demoted task(s): archive or delete
  const gone = [t, ...tree];
  if (o.keep){ for (const g of gone){ g.status = 'archived'; g.demoted_into = target.id; if (g === t) g.parent = target.id; g.list = target.list; changed.push(g); } }   // T2-5: a subtask's list = its parent's
  if (!(await saveMany(changed))) { toast('Demote stopped — nothing was deleted.'); render(); return; }
  if (!o.keep) for (const g of gone) await removeTask(g);
  if (S.editing === t.id || tree.some(d => d.id === S.editing)) closeDrawer(true);
  if (S.editing === target.id) fillDrawer(target);
  toast(`Demoted into “${target.title}”`); render();
}

function modal(html, onAction, { sheet = false, noDismiss = false, full = false } = {}){
  const ae = document.activeElement, typing = ae && (ae.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
  if (!$('#modal-bg').classList.contains('on')) S.modalReturn = typing ? null : ae;      // T1-11: focus goes back here on close
  $('#modal').innerHTML = html; $('#modal-bg').classList.add('on'); $('#modal-bg').classList.toggle('sheet', sheet); $('#modal-bg').classList.toggle('full', full);
  const h = $('#modal h3'); if (h){ h.id = 'modal-title'; $('#modal').setAttribute('aria-labelledby', 'modal-title'); } else $('#modal').removeAttribute('aria-labelledby');
  if (!typing && !$('#modal').contains(document.activeElement)) $('#modal').focus({ preventScroll:true });   // (never while typing: no keyboard jumps on phones)
  S.modalNoDismiss = noDismiss;
  $('#modal').onclick = e => { const b = e.target.closest('[data-a]'); if (b) onAction(b.dataset.a); };
}
function closeModal(){ $('#modal-bg').classList.remove('on'); $('#modal').innerHTML = ''; S.modalNoDismiss = false;
  const r = S.modalReturn; S.modalReturn = null; if (r && r.isConnected && r !== document.body) try { r.focus({ preventScroll:true }); } catch {} }

/* R2-8 restore follow-up: how trash entries hang together, by task id and parent: (not by when they were deleted).
   Only deleted entries count (a replaced version's task still exists); for an id in the trash twice, the newest wins.
   tree(e) = its trashed subtasks at every level, top level first (a parent always comes back before its subtasks); shown(e) = the
   same as an indented tree for the dialog;
   a task that's already back is skipped, but its own trashed subtasks are still found. ancestors(e) = the chain of
   trashed parents above it, up to the first one that exists, topmost first. A loop of parent ids stops. */
function trashKin(entries){
  const byId = new Map();
  for (const e of entries) if (e.meta.reason !== 'replaced' && e.meta.id && !byId.has(e.meta.id)) byId.set(e.meta.id, e);
  const kidsOf = new Map();
  for (const e of byId.values()){ const p = e.meta.parent; if (p){ if (!kidsOf.has(p)) kidsOf.set(p, []); kidsOf.get(p).push(e); } }
  const tree = root => {
    const out = [], seen = new Set([root.meta.id]); let level = [root.meta.id], depth = 0;
    while (level.length){ depth++; const next = [];
      for (const id of level) for (const k of kidsOf.get(id) || []){
        if (seen.has(k.meta.id)) continue; seen.add(k.meta.id); next.push(k.meta.id);
        if (!S.tasks.has(k.meta.id)) out.push({ e:k, depth });
      }
      level = next; }
    return out;
  };
  const shown = root => {                       // the same entries for showing: as a tree, each task followed by its subtasks
    const out = [], seen = new Set([root.meta.id]);
    const walk = (id, depth) => { for (const k of kidsOf.get(id) || []){ if (seen.has(k.meta.id)) continue; seen.add(k.meta.id);
      if (!S.tasks.has(k.meta.id)) out.push({ e:k, depth }); walk(k.meta.id, depth + 1); } };
    walk(root.meta.id, 1); return out;
  };
  const ancestors = e => {
    const out = [], seen = new Set([e.meta.id]); let p = e.meta.parent;
    while (p && !S.tasks.has(p) && byId.has(p) && !seen.has(p)){ seen.add(p); const a = byId.get(p); out.unshift(a); p = a.meta.parent; }
    return out;
  };
  const counts = e => e.meta.reason !== 'replaced' && e.meta.id && byId.get(e.meta.id) === e;   // has kin worth asking about
  return { tree, shown, ancestors, counts };
}

/* R2-8 Deleted A: ⋯ → Recently deleted. Every trash entry, due-dated ones first (they matter most), each newest first;
   Restore puts the file back where it was. Full screen on a phone. */
async function recentlyDeleted(){
  if (!S.store) return;
  const opts = { sheet:true, full:IS_PHONE };
  const shell = body => `<h3>Recently deleted</h3><p class="rd-note">Deleted tasks and replaced versions, kept in the task folder's hidden <code>${TRASH}</code> folder (on every device). Nothing is emptied automatically.</p>
    <div id="rd-list">${body}</div><div class="btns"><button data-a="close">Close</button></div>`;
  let entries = [];
  const draw = () => {
    if (!$('#rd-list')) return;
    const due = entries.filter(e => e.meta.due), rest = entries.filter(e => !e.meta.due), kin = trashKin(entries);
    const item = (e, i) => { const m = e.meta, by = m.by === 'elsewhere', n = kin.counts(e) ? kin.tree(e).length : 0;
      const what = m.reason === 'replaced' ? (by ? 'Replaced: the other version, overwritten' : 'Replaced: your version, not used') : 'Deleted';
      return `<div class="rd-item${m.due ? ' rd-due' : ''}"><div class="rd-body"><div class="rd-ttl">${esc(m.title || baseName(m.path || e.md.path))}</div>
        ${m.due ? `<div class="rd-duev">Due ${esc(dueText(m.due))}</div>` : ''}
        ${n ? `<div class="rd-kids">+ ${n} subtask${n > 1 ? 's' : ''}</div>` : ''}
        <div class="rd-meta">${esc(what)}${m.device ? ` on ${esc(m.device)}` : ''}${m.deletedAt ? ` · ${esc(whenText(Date.parse(m.deletedAt)))}` : ''} · <code>${esc(m.path || '')}</code></div></div>
        <button data-a="r:${i}">Restore</button></div>`; };
    const idx = e => entries.indexOf(e);
    $('#rd-list').innerHTML = !entries.length ? '<p class="rd-note">Nothing here.</p>' :
      (due.length ? `<div class="group-head" style="width:auto;padding-left:0">With a due date · ${due.length}</div>` + due.map(e => item(e, idx(e))).join('') : '') +
      (rest.length ? `<div class="group-head" style="width:auto;padding-left:0">${due.length ? 'Others' : 'All'} · ${rest.length}</div>` + rest.map(e => item(e, idx(e))).join('') : '');
  };
  const load = async () => { try { entries = await trashEntries(); draw(); }
    catch (e){ if ($('#rd-list')) $('#rd-list').innerHTML = `<p class="rd-note">Couldn't read the trash: ${esc(e.message)}</p>`; storeError(e, 'reading the trash'); } };
  const ask = html => new Promise(res => modal(html, res, opts));
  const ttl = e => e.meta.title || baseName(e.meta.path || e.md.path);
  /* R2-8 restore follow-up. Q2: its parent is in the trash too → restore that chain first? Q1: it has trashed subtasks
     (every level, including ones deleted separately earlier, marked so) → Restore all / Only this task. */
  const restoreFlow = async e => {
    const kin = trashKin(entries), asks = kin.counts(e);
    const ups = asks ? kin.ancestors(e) : [];
    let withUps = false;
    if (ups.length){
      const dad = ups[ups.length - 1], more = ups.length - 1;          // its direct parent, then the chain above it
      const a = await ask(`<h3>Restore its parent too?</h3><p>Its parent <b>${esc(ttl(dad))}</b> is also in Recently deleted${more ? ` (and ${more} task${more > 1 ? 's' : ''} above it)` : ''} — restore ${more ? 'them' : 'it'} too?</p>
        <p class="rd-note">Without ${more ? 'them' : 'it'}, <b>${esc(ttl(e))}</b> comes back without its parent.</p>
        <div class="btns"><button data-a="cancel">Cancel</button><button data-a="only">Only this task</button><button class="primary" data-a="up">Restore ${more ? 'them' : 'parent'} too</button></div>`);
      if (a !== 'only' && a !== 'up') return;
      withUps = a === 'up';
    }
    const subs = asks ? kin.tree(e) : [];
    let withSubs = false;
    if (subs.length){
      const MAX = 10, levels = Math.max(...subs.map(s => s.depth)) + 1, at = Date.parse(e.meta.deletedAt || '');
      const earlier = s => { const w = Date.parse(s.e.meta.deletedAt || ''); return at && w && Math.abs(at - w) > 60000; };
      const li = s => `<li style="margin-left:${(s.depth - 1) * 14}px">${esc(ttl(s.e))}${s.e.meta.due ? ` <span class="dl-sdue">· due ${esc(dueText(s.e.meta.due))}</span>` : ''}${earlier(s) ? ' <span class="rd-meta">· deleted separately</span>' : ''}</li>`;
      const a = await ask(`<h3>Restore its subtasks too?</h3><p>Restore <b>${esc(ttl(e))}</b> and its ${subs.length} subtask${subs.length > 1 ? 's' : ''}${levels > 2 ? ` (${levels} levels)` : ''}?</p>
        <ul class="dl-subs">${kin.shown(e).slice(0, MAX).map(li).join('')}${subs.length > MAX ? `<li class="dl-more">and ${subs.length - MAX} more</li>` : ''}</ul>
        <div class="btns"><button data-a="cancel">Cancel</button><button data-a="only">Only this task</button><button class="primary" data-a="all">Restore all</button></div>`);
      if (a !== 'only' && a !== 'all') return;
      withSubs = a === 'all';
    }
    const plan = [...(withUps ? ups : []), e, ...(withSubs ? subs.map(s => s.e) : [])], done = [];
    modal(shell('<p class="rd-note">Restoring…</p>'), () => {}, opts);
    busy(1);
    try {
      for (const x of plan){
        if (plan.length > 1) toast(`Restoring ${done.length + 1} of ${plan.length}…`);
        done.push({ file: await trashRestore(x), x });
      }
    } catch (err){ storeError(err, 'restore'); }
    finally { busy(-1); syncLists(); render(); }
    if (!done.length) return;
    const left = plan.length - done.length, renamed = done.filter(d => d.file !== d.x.meta.path);
    toast(left ? `Restored ${done.length} of ${plan.length} — ${left} ${left > 1 ? 'are' : 'is'} still in Recently deleted.`
      : plan.length > 1 ? `Restored ${plan.length} tasks${renamed.length ? ` (${renamed.length} under a new name — the name was taken)` : ''}`
      : renamed.length ? `Restored as ${done[0].file} (the name was taken)` : `Restored “${ttl(e)}”`);
    showUndo(done.length > 1 ? `Restored “${ttl(done[0].x)}” and ${done.length - 1} more` : `Restored “${ttl(e)}”`, async () => {
      busy(1);                                  // one Undo for the whole restore: deleted again (back to the trash), subtasks first
      try { for (const d of [...done].reverse()){ const t = all().find(x => x.file === d.file); if (t) await removeTask(t); } }
      finally { busy(-1); syncLists(); render(); }
    }, 15000);
  };
  const open = () => modal(shell('<p class="rd-note">Loading…</p>'), async a => {
    if (a === 'close') return closeModal();
    if (!a.startsWith('r:')) return;
    const e = entries[+a.slice(2)]; if (!e || e.busy) return; e.busy = true;
    try { await restoreFlow(e); } finally { e.busy = false; }
    open(); await load();
  }, opts);
  open(); await load();
}

/* ---------------- start-up / storage choice ---------------- */
async function useStore(store){
  if (S.editing) closeDrawer(true);
  const scope = store.snapshot && ls.get('todo.deviceCopy', true) && window.indexedDB ? await deviceCopyScope(store) : null;
  if (scope){                                                                     // R2-7 A: keep a copy on this device
    store = new CachedStore(store, scope);
    navigator.storage?.persist?.().catch(() => {});
  }
  guardWrites(store); S.tooNew = 0; $('#ro-bar').hidden = true;
  S.store = store; S.signedOut = false; S.list = ls.get('todo.list', '');
  S.draftScope = scope || (store.kind === 'demo' ? 'demo' : store.kind === 'onedrive' ? `onedrive|${S.auth?.user?.() || ''}|${store.folder.toLowerCase()}` : `local|${store.name}`);   // R2-8 Overwritten C
  let fromCopy = false;
  if (store.warm){ const recs = await store.warm(); if (recs.length){ buildFrom(recs); syncLists(); render(); fromCopy = true; } }
  if (store.cachedLayer && !fromCopy){                // T2-4: nothing on this device yet — say what's happening while every file downloads once
    S.firstFill = { n:0, total:0 };                   // T3-2: until it's done the half-loaded list can't be acted on (render, quick-add, list picker)
    store.onProgress = (n, total) => { if (S.store !== store || !S.firstFill) return; S.firstFill = { n, total }; render(); };
  }
  try { await loadAll(); }
  catch (e){
    if (store.cachedLayer) store.onProgress = null;
    S.firstFill = null;
    if (fromCopy && e instanceof OfflineError){            // no connection: keep showing this device's copy, keep retrying
      S.offline = true; setStat(); toast("Offline — showing this device's saved copy"); schedulePoll(); return;
    }
    S.store = null; render();
    if (e instanceof AuthError){                  // remembered account, but Microsoft wants a fresh sign-in (e.g. 24 h limit)
      logNote('sign-in: background renewal failed (' + e.message + ')');       // R2-6 C: no automatic redirect any more
      S.signedOut = true; showStart('Your sign-in expired — tap Sign in to continue.');
      return;
    }
    showStart(e instanceof FolderError ? e.message : e instanceof OfflineError ? "You're offline — connect and reload." : 'Could not load the task files: ' + e.message); return; }
  if (store.cachedLayer) store.onProgress = null;
  if (store.kind !== 'demo' && S.tasks.size === 0 && !S.cfgVersion) offerSeed();
  restoreDraft();
  offerDrafts();                                      // R2-8 Overwritten C
  schedulePoll();
}
function showStart(msg){
  const src = ls.get('todo.source', 'onedrive');
  S.store = null; render();
  $('#list-label').textContent = 'HTML-ToDo-App';
  fitListName();
  $('#rows').innerHTML = `<div class="start">
    <h2>${src === 'onedrive' ? 'Sign in to your OneDrive' : 'Choose your task files'}</h2>
    <p>${msg ? esc(msg) : src === 'onedrive' ? `Your tasks are plain <code>.md</code> files in the OneDrive folder <b>${esc(ls.get('todo.folder', DEFAULT_FOLDER))}</b>. The same files open on your phone and PC.` : 'Open a folder of task files.'}</p>
    <div class="btns">
      ${src === 'onedrive' && !window.__NETLOCK__ ? '<button class="primary" data-start="signin">Sign in with Microsoft</button>' : ''}
      ${window.showDirectoryPicker ? '<button data-start="local">Open a local folder…</button>' : ''}
      <button data-start="demo">Try the demo data</button>
      <button data-start="settings">Settings…</button>
    </div></div>`;
}
$('#rows').addEventListener('click', e => {
  const b = e.target.closest('[data-start]'); if (!b) return;
  const a = b.dataset.start;
  if (a === 'signin') signIn();
  else if (a === 'local'){ ls.set('todo.source', 'local'); pickLocalFolder(); }
  else if (a === 'demo'){ ls.set('todo.source', 'demo'); useStore(new MemStore(sampleFiles())); }
  else if (a === 'settings') settingsDialog();
});
/* R2-6 C: sign in on a tap. A popup first (the app window stays put, so Chrome can't switch it to desktop mode);
   if the popup can't open or can't report back, the old redirect. After one failed popup this session, go straight
   to the redirect, so a phone where popups don't work isn't stuck. */
async function signIn(){
  if (!S.auth || S.signingIn) return;
  if (S.auth.signInPopup && !sessionStorage.getItem('todo.popupFailed')){
    S.signingIn = true; let account = null, why = '';
    try { account = await S.auth.signInPopup(); } catch (e){ why = e.errorCode || e.message || 'error'; }
    S.signingIn = false;
    if (account){ logNote('sign-in: popup ok'); return afterSignIn(account); }
    logNote('sign-in: popup failed (' + why + ')'); sessionStorage.setItem('todo.popupFailed', '1');
    if (/user_cancelled/.test(why)){ toast('Sign-in window closed — tap Sign in again to retry.'); return; }
  }
  logNote('sign-in: redirect');
  stashDraft(); S.redirecting = true;
  $('#rows').innerHTML = '<div class="start"><h2>Signing in…</h2><p>Taking you to Microsoft.</p></div>';
  Promise.resolve(S.auth.signIn()).catch(e => { S.redirecting = false; showStart('Sign-in failed: ' + (e.errorCode || e.message)); });
}
async function afterSignIn(account){
  ls.set('todo.everSignedIn', true); if (account?.username) ls.set('todo.lastUser', account.username);
  S.signedOut = false;
  if (S.store?.kind === 'onedrive'){ setStat(); toast('Signed in again'); poll(true); }      // mid-session: carry on where you were
  else await useStore(new GraphStore(S.auth, ls.get('todo.folder', DEFAULT_FOLDER)));
}
/* T1-8: signing out also removes this account's task files from the device copy (they'd otherwise stay in the browser) */
async function signOut(){
  if (S.editing && isDirty()) return toast('Save or close the open task first.');
  const user = S.auth?.user?.() || '';
  clearTimeout(pollTimer); if (S.store?.cachedLayer) S.store.usable = false;        // nothing more goes into the copy
  try { if (window.indexedDB) await devCache.dropScopes(s => String(s).startsWith(`onedrive|${user}|`)); } catch (e){ console.warn('device copy: not cleared', e); }
  S.redirecting = true; S.auth.signOut();
}
$('#d-signin').onclick = () => signIn();
function reauth(){                       // session gone mid-use (S-5): the tasks stay on screen; a tap signs in again (R2-6 C)
  if (S.signedOut) return;                // already handled — don't repeat on every poll
  S.signedOut = true; setStat(); logNote('sign-in: expired mid-session');
  toast('Sign-in expired — tap the status icon to sign in again.');

async function startOneDrive(){
  const folder = ls.get('todo.folder', DEFAULT_FOLDER);
  S.auth = window.__TEST_AUTH__ || new MsalAuth(ls.get('todo.clientId', DEFAULT_CLIENT_ID));
  let account = null, redirectReturn = false;
  try { ({ account, redirectReturn } = await S.auth.init()); }
  catch (e){ showStart('Sign-in problem: ' + (e.errorCode || e.message) + (/redirect_uri|AADSTS50011/i.test(e.message) ? ` — this page's address (${REDIRECT}) must be added to the Azure app registration.` : '')); return; }
  if (redirectReturn) logDevice('back from Microsoft (redirect)');     // R2-6: does the redirect bring desktop mode with it?
  if (!account && ls.get('todo.everSignedIn', false) && S.auth.silent){      // R2-6 C: renew in the background first
    try { account = await S.auth.silent(); logNote('sign-in: background renewal ok'); }
    catch (e){ logNote('sign-in: background renewal failed (' + (e.errorCode || e.message) + ')'); }
  }
  if (account){
    ls.set('todo.everSignedIn', true); if (account.username) ls.set('todo.lastUser', account.username);
    await useStore(new GraphStore(S.auth, folder));
  } else if (ls.get('todo.everSignedIn', false)){
    S.signedOut = true; showStart('Your sign-in expired — tap Sign in to continue.');   // no automatic redirect (R2-6 C)
  } else { S.signedOut = true; showStart(); }
}
/* R2-4: the default local task folder is <root>\data, next to the build folder (<root>\html-todo-app-<build>\app\index.html).
   A page can't open a folder by path, so the app shows the path to paste into the folder dialog, then checks the pick. */
function suggestedLocalPath(href = location.href){
  let u; try { u = new URL(href); } catch { return null; }
  if (u.protocol !== 'file:') return null;
  const parts = decodeURIComponent(u.pathname).split('/').filter(Boolean); parts.pop();          // drop index.html
  if ((parts[parts.length - 1] || '').toLowerCase() === 'app') parts.pop();                       // drop app
  parts.pop();                                                                                    // drop the build folder
  if (!parts.length) return null;
  const win = /^[a-z]:$/i.test(parts[0]);
  return win ? parts.concat(LOCAL_FOLDER).join('\\') : (u.host ? '\\\\' + u.host + '\\' + parts.concat(LOCAL_FOLDER).join('\\') : '/' + parts.concat(LOCAL_FOLDER).join('/'));
}
async function folderLooks(dir){                       // what's in a picked folder (top level only)
  const r = { tasks:false, app:false };
  try { for await (const [name, h] of dir.entries()){
    if (h.kind === 'file' && isStorePath(name)) r.tasks = true;
    if ((h.kind === 'file' && /^index\.html$/i.test(name)) || (h.kind === 'directory' && /^(app|vendor)$/i.test(name))) r.app = true;
  } } catch {}
  return r;
}
function pickLocalFolder(){

  const path = suggestedLocalPath();
  modal(`<h3>Choose your task folder</h3>
    ${path ? `<p>Your tasks go in a folder named <b>${LOCAL_FOLDER}</b> next to the app's build folder:</p>
      <p><input type="text" id="lf-path" readonly value="${esc(path)}" style="width:100%"></p>
      <p style="font-size:13px;color:var(--muted)">In the next window, paste this into the address bar and press Enter, then click <b>Select Folder</b>. The first time, go to the folder above it and use <b>New folder</b> to create <b>${LOCAL_FOLDER}</b>.</p>`
    : `<p>Pick the folder that holds your task files (for example one named <b>${LOCAL_FOLDER}</b>).</p>`}
    <div class="btns"><button data-a="cancel">Cancel</button>${path ? '<button data-a="copy">Copy path</button>' : ''}<button class="primary" data-a="pick">Choose folder…</button></div>`,
    async a => {
      if (a === 'copy'){ const i = $('#lf-path'); i.select();
        try { await navigator.clipboard.writeText(path); toast('Path copied'); } catch { document.execCommand?.('copy'); toast('Path selected — press Ctrl+C'); } return; }
      closeModal(); if (a !== 'pick'){ if (!S.store) showStart(); return; }
      let dir;
      try { dir = await window.showDirectoryPicker({ id:'task-board', mode:'readwrite' }); }
      catch (e){ if (e.name !== 'AbortError') toast('Could not open folder: ' + e.message); else if (!S.store) showStart(); return; }
      const looks = await folderLooks(dir);
      const named = dir.name.toLowerCase() === LOCAL_FOLDER;
      if (looks.app || (!named && !looks.tasks)){
        const why = looks.app ? `“${esc(dir.name)}” looks like the app's own folder, not a task folder.`
          : `“${esc(dir.name)}” has no task files and isn't named <b>${LOCAL_FOLDER}</b>.`;
        modal(`<h3>Use this folder?</h3><p>${why}</p>
          <div class="btns"><button data-a="again">Choose another</button><button data-a="use">Use it anyway</button></div>`,
          b => { closeModal(); if (b === 'use') openLocalDir(dir); else pickLocalFolder(); }, { noDismiss:true });
        return;
      }

    }, { sheet:true });
}
async function openLocalDir(dir){
  try { await idb.set('dir', dir); } catch {}

const idb = {
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('task-board', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = await this.open(); return new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); },
  async set(k, v){ const db = await this.open(); return new Promise(res => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); },
};
async function tryRestoreFolder(){
  let dir; try { dir = await idb.get('dir'); } catch {}

  const perm = await dir.queryPermission?.({ mode:'readwrite' });
  if (perm === 'granted'){ await useStore(new FsStore(dir)); return true; }
  showStart('Chrome needs your permission again to open the folder.');
  const b = document.createElement('button'); b.className = 'primary'; b.textContent = `Reconnect “${dir.name}”`;
  b.onclick = async () => { if (await dir.requestPermission({ mode:'readwrite' }) === 'granted') await useStore(new FsStore(dir)); };

}
